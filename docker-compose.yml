version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: live2030_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-live2030}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: live2030_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: live2030_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AGORA_APP_ID: ${AGORA_APP_ID:?AGORA_APP_ID must be set in .env}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:?AGORA_APP_CERTIFICATE must be set in .env}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      RSOMPAY_ENV: ${RSOMPAY_ENV:-sandbox}
      RSOMPAY_API_KEY: ${RSOMPAY_API_KEY:-}
      RSOMPAY_WEBHOOK_SECRET: ${RSOMPAY_WEBHOOK_SECRET:-}
      RSOMPAY_BASE_URL: ${RSOMPAY_BASE_URL:-https://demo-integration.rsompay.com/api/external/v1}
      RSOMPAY_RETURN_URL: ${RSOMPAY_RETURN_URL:-}
      RSOMPAY_NOTIFICATION_URL: ${RSOMPAY_NOTIFICATION_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    container_name: live2030_admin
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
